# Resource bundle for the Message Moderation plugin.
#
# The name and location are dictated by Openfire: LocaleUtils.getLocalizedPluginString builds the
# bundle name as <plugin name>.replaceAll("\\W", "").toLowerCase() + "_i18n", so
# <name>Message Moderation</name> -> messagemoderation_i18n, loaded from the CLASSPATH ROOT of the
# plugin's lib jar. Without it, every SystemProperty registration logs an ERROR with a stack trace.
#
# SystemProperty derives each key as "system_property." + the property key, so every property in
# ModerationProperties needs an entry here. ASCII only.

system_property.plugin.messagemoderation.enabled=Let MUC moderators retract other occupants' messages for everyone (XEP-0425). Switching it off withdraws the feature from service discovery at once, so clients stop offering it.
